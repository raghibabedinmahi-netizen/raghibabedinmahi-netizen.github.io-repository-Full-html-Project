<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatPhotoApp</title>
</head>
<body>
    <h2>CatPhotoApp</h2>
    <main>
        <h3>Cat Photos</h3>
        <!--TODO: Add link to cat photos -->
        <p>Click here to view more <a href="#" target="_blank">cat photos</a>.</p>
        
        <a href="#"><img src="https://i.pinimg.com/736x/99/b1/22/99b12266983985b821e69e56413ed67c.jpg" alt="A cute orange cat lying on its back." width="250" height="250"></a>
        <h3>Cat Lists</h3>
        <div class="lists">
        <p>Things cats <em>love</em>:</p>
        <ul>
            <li>cat nip</li>
            <li>laser pointers</li>
            <li>lasagna</li>
        </ul>
        <img src="images/Lasagne.jpg" alt="Lasagna" width="250" height="250">
        <p>Things cats <strong>hate</strong>:</p>
        <ol>
            <li>flea treatment</li>
            <li>thunder</li>
            <li>other cats</li>
        </ol>
        </div>

        <img src="images/cats.jpg" alt="Cats" width="250" height="250">

        <form action="/submit-cat-photo">
            <label for="indoor"><input id="indoor" type="radio" name="indoor-outdoor" checked> indoor</label><br>

            <label for="outdoor"><input id="outdoor" type="radio" name="indoor-outdoor"> outdoor</label><br>

            <label for="loving"><input type="checkbox" name="personality" id="loving" checked> Loving</label><br>

            <label for="lazy"><input type="checkbox" name="personality" id="lazy" > Lazy</label><br>

            <label for="energetic"><input type="checkbox" name="personality" id="energetic"> Energetic</label><br>

            <input type="text" name="" placeholder="cat photo URL" required><br>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p><small>No Copyright - <a href="https://freecodecamp.org">freeCodeCamp.org</a></small></p>
    </footer>
</body>
</html>
